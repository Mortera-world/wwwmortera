<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mortera Wikia</title>
  <style>
    :root{
      --bg:#0b0f17;
      --panel:rgba(255,255,255,.06);
      --panel2:rgba(255,255,255,.08);
      --line:rgba(255,255,255,.10);
      --text:rgba(255,255,255,.90);
      --muted:rgba(255,255,255,.62);
      --muted2:rgba(255,255,255,.45);
      --accent:#7c5cff;
      --accent2:#38bdf8;
      --radius:18px;
      --shadow: 0 18px 50px rgba(0,0,0,.35);
      --shadow2: 0 10px 30px rgba(0,0,0,.28);
      --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family:var(--font);
      color:var(--text);
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(124,92,255,.35), transparent 60%),
        radial-gradient(900px 500px at 100% 0%, rgba(56,189,248,.18), transparent 55%),
        radial-gradient(800px 400px at 0% 40%, rgba(124,92,255,.14), transparent 60%),
        var(--bg);
    }

    .top{
      padding:42px 18px 16px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:14px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      user-select:none;
    }
    .logo{
      width:40px;height:40px;
      border-radius:14px;
      background: linear-gradient(135deg, rgba(124,92,255,.95), rgba(56,189,248,.85));
      box-shadow: var(--shadow2);
      display:grid; place-items:center;
      font-weight:800;
      letter-spacing:-.5px;
    }
    h1{
      margin:0;
      font-size:28px;
      letter-spacing:.2px;
      font-weight:750;
    }
    .sub{
      margin-top:-6px;
      color:var(--muted2);
      font-size:13px;
      text-align:center;
    }

    .searchWrap{
      width:min(860px, 92vw);
      position:relative;
    }
    .search{
      width:100%;
      display:flex;
      align-items:center;
      gap:10px;
      padding:14px 14px;
      border-radius:999px;
      background: rgba(255,255,255,.06);
      border:1px solid var(--line);
      box-shadow: var(--shadow2);
      backdrop-filter: blur(10px);
    }
    .search svg{ opacity:.75; }
    .search input{
      width:100%;
      border:0;
      outline:none;
      background:transparent;
      color:var(--text);
      font-size:14px;
      letter-spacing:.1px;
    }
    .hint{
      color:var(--muted2);
      font-size:12px;
      margin:10px 4px 0;
      text-align:center;
    }

    .results{
      position:absolute;
      top:58px;
      left:0;
      right:0;
      background: rgba(15,18,28,.92);
      border:1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow:hidden;
      display:none;
      z-index:50;
      backdrop-filter: blur(10px);
    }
    .resultsHeader{
      padding:10px 12px;
      font-size:12px;
      color:var(--muted);
      border-bottom:1px solid var(--line);
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .resultsList{
      max-height: 320px;
      overflow:auto;
    }
    .resultItem{
      padding:12px 12px;
      display:flex;
      gap:10px;
      align-items:flex-start;
      cursor:pointer;
      border-bottom:1px solid rgba(255,255,255,.06);
      transition: background .15s ease;
    }
    .resultItem:hover{ background: rgba(255,255,255,.06); }
    .pill{
      font-size:11px;
      padding:4px 8px;
      border:1px solid rgba(124,92,255,.35);
      border-radius:999px;
      color: rgba(212,205,255,.95);
      background: rgba(124,92,255,.12);
      white-space:nowrap;
      margin-top:1px;
    }
    .resultTitle{ font-size:13.5px; font-weight:650; margin:0; }
    .resultMeta{ font-size:12px; color:var(--muted2); margin-top:2px; }

    .layout{
      width:min(1200px, 94vw);
      margin: 14px auto 40px;
      display:grid;
      grid-template-columns: 330px 1fr;
      gap:16px;
      align-items:start;
    }

    .card{
      background: rgba(255,255,255,.06);
      border:1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow2);
      backdrop-filter: blur(10px);
      overflow:hidden;
    }

    .sidebarHeader{
      padding:14px 14px 10px;
      border-bottom:1px solid var(--line);
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .sidebarHeader .t{
      font-weight:700;
      font-size:13px;
      letter-spacing:.2px;
      color:rgba(255,255,255,.86);
    }
    .sidebarHeader .k{
      font-size:12px;
      color:var(--muted2);
    }

    .cats{ padding:8px; }
    .cat{
      border-radius: 14px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.06);
      background: rgba(255,255,255,.03);
      margin-bottom:10px;
    }
    .catBtn{
      width:100%;
      border:0;
      outline:none;
      background:transparent;
      color:var(--text);
      padding:12px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      cursor:pointer;
      transition: background .15s ease;
    }
    .catBtn:hover{ background: rgba(255,255,255,.05); }
    .left{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }
    .ico{
      width:34px;height:34px;
      border-radius:12px;
      display:grid; place-items:center;
      background: rgba(124,92,255,.12);
      border:1px solid rgba(124,92,255,.25);
      flex:0 0 auto;
    }
    .catTitle{
      display:flex;
      flex-direction:column;
      gap:1px;
      min-width:0;
      text-align:left;
    }
    .catTitle strong{
      font-size:13px;
      font-weight:720;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .catTitle span{
      font-size:12px;
      color:var(--muted2);
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .badge{
      font-size:12px;
      padding:6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.07);
      border:1px solid rgba(255,255,255,.10);
      color: rgba(255,255,255,.80);
    }
    .chev{
      opacity:.7;
      margin-left:10px;
      transition: transform .25s cubic-bezier(.4,0,.2,1);
    }
    .cat.open .chev{
      transform: rotate(180deg);
    }

    .submenu{
      max-height: 0;
      overflow: hidden;
      padding: 0 10px;
      border-top: 1px solid rgba(255,255,255,.06);
      opacity: 0;
      transform: translateY(-6px);
      transition:
        max-height .35s cubic-bezier(.4,0,.2,1),
        opacity .25s ease,
        transform .25s ease,
        padding .25s ease;
    }
    
    .cat.open .submenu{
      max-height: 500px; /* suficiente para varias páginas */
      opacity: 1;
      transform: translateY(0);
      padding: 6px 10px 10px;
    }

    .pageBtn{
      width:100%;
      text-align:left;
      padding:10px 10px;
      border-radius: 12px;
      border:1px solid transparent;
      background: transparent;
      color: rgba(255,255,255,.86);
      cursor:pointer;
      display:flex;
      justify-content:space-between;
      gap:10px;
      transition: background .15s ease, border-color .15s ease;
      margin-top:6px;
      transition:
        background .15s ease,
        border-color .15s ease,
        transform .15s ease,
        opacity .15s ease;
    }
    .cat.open .pageBtn{
      animation: fadeUp .25s ease both;
    }
    @keyframes fadeUp{
      from{
        opacity: 0;
        transform: translateY(6px);
      }
      to{
        opacity: 1;
        transform: translateY(0);
      }
    }
    .pageBtn:hover{
      background: rgba(255,255,255,.05);
      border-color: rgba(255,255,255,.08);
    }
    .pageBtn small{
      color: var(--muted2);
      white-space:nowrap;
      margin-top:2px;
    }
    .contentHeader{
      padding:16px 18px;
      border-bottom:1px solid var(--line);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
    }
    .crumbs{
      font-size:12px;
      color: var(--muted2);
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
    }
    .crumbs .dot{
      width:4px;height:4px;border-radius:999px;
      background: rgba(255,255,255,.25);
      display:inline-block;
    }

    .content{
      padding:18px;
      line-height:1.6;
    }
    .content h2{
      margin:0 0 6px;
      font-size:18px;
      letter-spacing:.2px;
    }
    .content p{
      margin: 10px 0;
      color: rgba(255,255,255,.78);
      font-size:14px;
    }
    .hero{
      padding:14px 14px;
      border-radius: 16px;
      border:1px solid rgba(255,255,255,.10);
      background: linear-gradient(135deg, rgba(124,92,255,.14), rgba(56,189,248,.10));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
    }
    .mini{
      margin-top:12px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .chip{
      font-size:15px;
      padding:7px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.05);
      color: rgba(255,255,255,.75);
    }
    @media (max-width: 980px){
      .layout{ grid-template-columns: 1fr; }
    }
	.tabs { margin-top: 10px; }
    .tabbar{
      display:flex; gap:8px; flex-wrap:wrap;
      padding:10px;
      border-radius:14px;
      background: rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
    }
    .tab{
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      color: rgba(255,255,255,.80);
      padding:10px 12px;
      border-radius:12px;
      cursor:pointer;
      font-weight:650;
      transition: background .15s ease, transform .15s ease, border-color .15s ease;
    }
    .tab:hover{ transform: translateY(-1px); }
    .tab.active{
      background: rgba(124,92,255,.22);
      border-color: rgba(124,92,255,.35);
      color: rgba(255,255,255,.92);
    }
    .tabpanels{ margin-top: 12px; }
    .panel{ display:none; }
    .panel.active{ display:block; }
    
    .itemTable{
      width:100%;
      border-collapse: collapse;
      overflow:hidden;
      border-radius: 14px;
      border:1px solid rgba(255,255,255,.10);
    }
    .itemTable th, .itemTable td{
      padding:12px;
      border-bottom:1px solid rgba(255,255,255,.08);
      vertical-align: top;
      font-size:14px;
    }
    .itemTable th{
      color: rgba(255,255,255,.70);
      font-weight:700;
      background: rgba(255,255,255,.04);
    }
    .itemRow{
      display:flex; gap:14px; align-items:flex-start;
    }
    .itemRow img{
      width:48px; height:48px;
      image-rendering: pixelated;
      border-radius: 10px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.15);
    }
    .separation {
      border-collapse: collapse;
    }
    
    .separation td {
      vertical-align: middle;
      padding: 4px 4px;
    }
    
    .separation .img {
      text-align: center;
      width: 40px;
    }
    
    .separation img {
      display: block;
      margin: auto;
    }
	.link-center {
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <header class="top">
    <div class="brand">
      <div class="logo">M</div>
      <div>
        <h1>Mortera Wikia</h1>
      </div>
    </div>

    <div class="searchWrap">
      <div class="search" role="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">

                stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>

        <input id="q" type="search" placeholder="Buscar en la wiki…" autocomplete="off" />
      </div>

      <div id="results" class="results" aria-live="polite">
        <div class="resultsHeader">
          <span id="resultsTitle">Resultados</span>
          <span id="resultsCount"></span>
        </div>
        <div id="resultsList" class="resultsList"></div>

    </div>

  <main class="layout">

        </div>
        <div class="badge" id="contentTag">Inicio</div>
      </div>
      <div class="content" id="content"></div>
    </section>
  </main>

const norm = (s) => (s || "")
  .toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/[^\p{L}\p{N}\s-]/gu," ")
  .replace(/\s+/g," ")
  .trim();

function tokenize(s){
  return norm(s).split(" ").filter(Boolean);
}

function uniq(arr){
  return [...new Set(arr)];
}
const pageIndex = [];
WIKI.categories.forEach(cat=>{
  cat.pages.forEach(p=>{
    pageIndex.push({
      catId: cat.id,
      catTitle: cat.title,
      pageId: p.id,
      title: p.title,
      summary: p.summary,
      contentRaw: p.content,
      contentNorm: norm(`${p.title} ${p.summary} ${p.content}`)
    });
  });
});

function buildKeywords(){
  const words = [];
  for (const p of pageIndex){
    const tokens = tokenize(p.contentNorm);
    for (const t of tokens){
      if (t.length < 3) continue;
      words.push(t);
    }
  }
  const top = uniq(words).slice(0, 450).sort((a,b)=>a.localeCompare(b));
  return top;
}

function initTabs(root){
  const tabs = root.querySelectorAll("[data-tabs]");
  tabs.forEach(widget=>{
    const buttons = widget.querySelectorAll("[data-tab]");
    const panels  = widget.querySelectorAll("[data-panel]");

    function activate(name){
      buttons.forEach(b => b.classList.toggle("active", b.dataset.tab === name));
      panels.forEach(p => p.classList.toggle("active", p.dataset.panel === name));
    }
    buttons.forEach(b => b.addEventListener("click", ()=> activate(b.dataset.tab)));
    const first = buttons[0]?.dataset.tab;
    if (first) activate(first);
  });
}

function escapeHtml(str){
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
const q = document.getElementById("q");
const results = document.getElementById("results");
const resultsTitle = document.getElementById("resultsTitle");
const resultsCount = document.getElementById("resultsCount");
const resultsList = document.getElementById("resultsList");

function matchPages(query){
  const tokens = tokenize(query);
  if (!tokens.length) return [];

  const scored = [];

  for (const p of pageIndex){
    const hasAll = tokens.every(t => p.contentNorm.includes(t));
    if (!hasAll) continue;

    let score = 0;
    const tTitle = norm(p.title);
    const tSum = norm(p.summary);

    for (const t of tokens){
      if (tTitle.includes(t)) score += 5;
      if (tSum.includes(t)) score += 2;
      if (p.contentNorm.includes(t)) score += 1;
    }

    scored.push({ ...p, score });
  }

  scored.sort((a,b)=> (b.score - a.score) || a.title.localeCompare(b.title));
  return scored;
}


function openMatchingCategories(matches){
  document.querySelectorAll(".cat").forEach(el => el.classList.remove("open"));

  const cats = new Set(matches.map(m => m.catId));
  cats.forEach(catId => {
    const el = document.querySelector(`.cat[data-cat="${catId}"]`);
    if (el) el.classList.add("open");
  });
}



function showResults(query, matches){
  if (!query.trim()){
    closeResults();
    document.querySelectorAll(".cat").forEach(el => el.classList.remove("open"));
    return;
  }

  resultsTitle.textContent = "Resultados";
  resultsCount.textContent = `${matches.length}`;
  resultsList.innerHTML = "";

  if (!matches.length){
    const empty = document.createElement("div");
    empty.style.padding = "14px 12px";
    empty.style.color = "rgba(255,255,255,.62)";
    empty.style.fontSize = "13px";
    empty.textContent = "No se encontraron páginas con esa búsqueda.";
    resultsList.appendChild(empty);
    results.style.display = "block";
    return;
  }
  openMatchingCategories(matches);

  matches.slice(0, 50).forEach(m=>{
    const item = document.createElement("div");
    item.className = "resultItem";
    item.innerHTML = `
      <div class="pill">${m.catTitle}</div>
      <div style="min-width:0;">
        <div class="resultTitle">${m.title}</div>
        <div class="resultMeta">${m.summary || ""}</div>
      </div>
    `;
    item.addEventListener("click", ()=>{
      document.querySelectorAll(".cat").forEach(el => el.classList.remove("open"));
      const catEl = document.querySelector(`.cat[data-cat="${m.catId}"]`);
      if (catEl) catEl.classList.add("open");
    
      const cat = WIKI.categories.find(c=>c.id===m.catId);
      const page = cat.pages.find(p=>p.id===m.pageId);
      openPage(cat, page);
      closeResults();
    });
    resultsList.appendChild(item);
  });

  results.style.display = "block";
}

function closeResults(){
  results.style.display = "none";
}

function runSearch(){
  const query = q.value;
  const matches = matchPages(query);
  showResults(query, matches);
}

q.addEventListener("input", runSearch);
q.addEventListener("focus", ()=>{ if (q.value.trim()) runSearch(); });

document.addEventListener("click", (e)=>{
  const inside = e.target.closest(".searchWrap");
  if (!inside) closeResults();
});

document.addEventListener("keydown", (e)=>{
  if (e.key === "Escape") closeResults();
});

document.addEventListener("click", (e)=>{
  const link = e.target.closest("[data-open-page]");
  if (!link) return;

  e.preventDefault();
  openWikiPageById(link.dataset.openPage);
});

function openWikiPageById(pageId){
  const cat = WIKI.categories.find(c => c.pages.some(p => p.id === pageId));
  if (!cat) return;

  const page = cat.pages.find(p => p.id === pageId);
  if (!page) return;

  document.querySelectorAll(".cat").forEach(el => el.classList.remove("open"));
  const catEl = document.querySelector(`.cat[data-cat="${cat.id}"]`);
  if (catEl) catEl.classList.add("open");

  openPage(cat, page);
  closeResults();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
