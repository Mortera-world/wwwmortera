<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Royal Minimal Template</title>
  <style>
    :root {
      --royal-blue: #0d2a78;
      --royal-blue-soft: #173d9c;
      --midnight: #070d24;
      --gold: #d9b45a;
      --gold-light: #f7e2a8;
      --text: #eaf0ff;
      --glass: rgba(11, 30, 87, 0.72);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, #1f48b8 0%, transparent 45%),
        radial-gradient(circle at 80% 10%, #234cbf 0%, transparent 40%),
        radial-gradient(circle at 50% 100%, #09215a 0%, transparent 55%),
        linear-gradient(145deg, #040a19 0%, #0b1c4f 45%, #051031 100%);
      min-height: 100vh;
    }
    .top-info {
      background: linear-gradient(90deg, #1b3e9d, #0a1f5e);
      border-bottom: 1px solid var(--gold);
      color: var(--gold-light);
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: .9rem;
    }
    .wrap { width: min(1200px, 95%); margin: 16px auto; }
    .menu {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      background: var(--glass);
      border: 1px solid var(--gold);
      border-radius: 14px;
      padding: 10px;
      box-shadow: 0 8px 25px rgba(0,0,0,.25);
    }
    .menu button {
      border: 1px solid var(--gold);
      background: linear-gradient(180deg, var(--royal-blue-soft), var(--royal-blue));
      color: var(--gold-light);
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: transform .2s ease, filter .2s ease;
    }
    .menu button:hover { transform: translateY(-1px); filter: brightness(1.1); }
    .grid {
      margin-top: 16px;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 16px;
    }
    .card {
      background: var(--glass);
      border: 1px solid var(--gold);
      border-radius: 14px;
      padding: 14px;
      backdrop-filter: blur(4px);
    }
    h2, h3 { margin: 0 0 10px; color: var(--gold-light); }
    input, .btn {
      width: 100%;
      margin: 6px 0;
      border-radius: 8px;
      border: 1px solid #c8a44f;
      padding: 10px;
    }
    input { background: #0b1f56; color: #fff; }
    .btn {
      background: linear-gradient(180deg, #274bb6, #152f81);
      color: #ffefc0;
      font-weight: 600;
      cursor: pointer;
    }
    .banner {
      background: linear-gradient(120deg, rgba(217,180,90,.2), rgba(39,75,182,.15));
      border: 1px dashed var(--gold);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .news-item { padding: 8px 0; border-bottom: 1px solid rgba(247,226,168,.2); }
    .news-item:last-child { border-bottom: 0; }
    .boosts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }
    .tag {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid var(--gold);
      color: #ffe6a0;
      font-size: .8rem;
      margin-bottom: 8px;
    }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="top-info">
    <div><strong>RoyalOT</strong> • Online: <span id="online">0</span> • Ping: <span id="ping">--</span>ms</div>
    <div>Server Save: 10:00 CET • Double XP Weekend Activo</div>
  </div>

  <div class="wrap">
    <nav class="menu">
      <button>Inicio</button><button>Descargas</button><button>Noticias</button>
      <button>Ranking</button><button>Bosses</button><button>Soporte</button>
    </nav>

    <div class="grid">
      <aside>
        <section class="card">
          <h3>Login Box</h3>
          <input type="text" placeholder="Cuenta o Email" />
          <input type="password" placeholder="Contraseña" />
          <button class="btn">Entrar</button>
        </section>

        <section class="card" style="margin-top:12px;">
          <h3>Download Box</h3>
          <button class="btn">Cliente Windows</button>
          <button class="btn">Cliente Linux</button>
          <button class="btn">Launcher Auto-Update</button>
        </section>
      </aside>

      <main>
        <section class="banner">
          <h2>Banners Reales</h2>
          <p>Nuevo mapa + zonas elite desbloqueadas. Evento “Corona del Rey” disponible hoy.</p>
        </section>

        <section class="card" style="margin-bottom:12px;">
          <h3>News</h3>
          <div id="news"></div>
        </section>

        <section class="card">
          <h3>Boss & Monster Boost</h3>
          <div class="boosts" id="boosts"></div>
        </section>
      </main>
    </div>
  </div>

  <script>
    const news = [
      { t: 'Patch 1.1.8', d: 'Balance de vocaciones + mejoras de rendimiento.' },
      { t: 'Evento Imperial', d: 'Drop x2 en bosses de castillo hasta domingo.' },
      { t: 'Anti-lag update', d: 'Mejoras en login y tiempos de carga del cliente.' }
    ];

    const boosts = [
      { n: 'Ferumbras', b: '+35% loot' },
      { n: 'Orshabaal', b: '+25% XP' },
      { n: 'Dragon Lord', b: '+20% spawn' },
      { n: 'Hydra', b: '+18% respawn' }
    ];

    document.getElementById('news').innerHTML = news
      .map(i => `<div class="news-item"><span class="tag">${i.t}</span><div>${i.d}</div></div>`).join('');

    document.getElementById('boosts').innerHTML = boosts
      .map(i => `<article class="banner"><strong>${i.n}</strong><p>${i.b}</p></article>`).join('');

    const online = document.getElementById('online');
    const ping = document.getElementById('ping');
    function tickStats() {
      online.textContent = 280 + Math.floor(Math.random() * 45);
      ping.textContent = 48 + Math.floor(Math.random() * 15);
    }
    tickStats();
    setInterval(tickStats, 5000);
  </script>
</body>
</html>
